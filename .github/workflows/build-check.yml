name: Build check

# Hostinger runs this site as a Node.js app and builds it there, so GitHub does
# NOT deploy. What GitHub does instead is prove the build works BEFORE you click
# Redeploy in hPanel.
#
# Why that matters: if the build is broken, Hostinger's redeploy fails partway
# and you can be left staring at a half-updated or dead site while you work out
# what went wrong. This catches it on GitHub first, for free, in about a minute.
#
# Green check next to your commit = safe to redeploy.
# Red X = fix it before touching hPanel.
#
# No secrets needed. Nothing to configure.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-check:
    name: Verify the site builds and serves
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check the build output
        run: |
          set -e

          if [ ! -f dist/index.html ]; then
            echo "::error::dist/index.html missing - the build produced nothing usable."
            exit 1
          fi

          if find dist -name '*.php' | grep -q .; then
            echo "::error::A .php file ended up in the build. Hostinger's Node app cannot run PHP."
            find dist -name '*.php'
            exit 1
          fi

          echo "Size: $(du -sh dist | cut -f1) across $(find dist -type f | wc -l) files"

      - name: Smoke-test the production server
        run: |
          set -e
          PORT=8080 npm start &
          SERVER_PID=$!

          for i in $(seq 1 20); do
            if curl -sf -o /dev/null http://127.0.0.1:8080/; then break; fi
            sleep 0.5
          done

          fail() { echo "::error::$1"; kill $SERVER_PID 2>/dev/null; exit 1; }

          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/)
          [ "$code" = "200" ] || fail "Homepage returned $code, expected 200"

          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/about)
          [ "$code" = "200" ] || fail "SPA route /about returned $code - React Router deep links are broken"

          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/assets/definitely-not-real.js)
          [ "$code" = "404" ] || fail "Missing asset returned $code, expected 404"

          curl -s http://127.0.0.1:8080/ | grep -qi "hamza" || fail "Homepage HTML does not contain the site name"

          echo "Server smoke test passed."
          kill $SERVER_PID 2>/dev/null || true

      - name: Warn about unfinished configuration
        if: always()
        run: |
          if grep -rq "YOUR_DONATIONS_ACCESS_KEY\|YOUR_GENERAL_ACCESS_KEY" src/lib/submissions.js; then
            echo "::warning file=src/lib/submissions.js::Web3Forms access keys are still placeholders - every form shows success but emails nobody. Get free keys at web3forms.com"
          fi

      - name: Ready
        run: echo "Build is good. Safe to hit Redeploy in hPanel."
