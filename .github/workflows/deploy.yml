name: Build and deploy to Hostinger

# Runs on every push to main. GitHub builds the site and uploads the built
# dist/ folder into Hostinger's public_html over FTP.
#
# You never need to run `npm run build` yourself, and dist/ stays git-ignored.
#
# REQUIRED repository secrets (Settings > Secrets and variables > Actions > Secrets):
#   FTP_SERVER     e.g. ftp.yourdomain.com  (or the IP hPanel shows)
#   FTP_USERNAME   e.g. u123456789.yourdomain
#   FTP_PASSWORD   the FTP account password
#
# OPTIONAL repository variables (same page, "Variables" tab) — only if the
# defaults are wrong for your account:
#   FTP_SERVER_DIR  default ./public_html/   (change for a subdomain folder)
#   FTP_PROTOCOL    default ftp              (set to ftps for encrypted transfer)
#   FTP_PORT        default 21

on:
  push:
    branches: [main]
  workflow_dispatch: # lets you re-deploy manually from the Actions tab

concurrency:
  group: hostinger-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build and upload
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build the site
        run: npm run build

      - name: Sanity-check the build before uploading
        run: |
          set -e

          if [ ! -f dist/index.html ]; then
            echo "::error::dist/index.html is missing - the build produced nothing usable."
            exit 1
          fi

          if [ ! -f dist/.htaccess ]; then
            echo "::error::dist/.htaccess is missing. Without it every route except the"
            echo "::error::homepage will 404 on Hostinger. Check that public/.htaccess exists."
            exit 1
          fi

          if find dist -name '*.php' | grep -q .; then
            echo "::error::A .php file ended up in the build. Remove it from public/."
            find dist -name '*.php'
            exit 1
          fi

          if grep -rq "YOUR_DONATIONS_ACCESS_KEY\|YOUR_GENERAL_ACCESS_KEY" dist/assets/ 2>/dev/null; then
            echo "::warning::Web3Forms access keys are still placeholders."
            echo "::warning::Forms will show success but email nobody."
            echo "::warning::Fix them in src/lib/submissions.js - see web3forms.com"
          fi

          echo "Build looks good."
          echo "Total size: $(du -sh dist | cut -f1)"
          echo "Files: $(find dist -type f | wc -l)"

      - name: Upload dist/ to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftp' }}
          port: ${{ vars.FTP_PORT || 21 }}
          local-dir: ./dist/
          server-dir: ${{ vars.FTP_SERVER_DIR || './public_html/' }}
          # Never let repo plumbing reach the web server.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/*.php

      - name: Done
        run: |
          echo "Deployed. If the site looks unchanged, hard-refresh with Ctrl+F5 -"
          echo "the .htaccess caches assets for a year (they are content-hashed,"
          echo "so new builds get new filenames and this is safe)."
